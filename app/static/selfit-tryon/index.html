<html lang="zh-CN">

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"

    <title>selfit · 试衣镜</title>
    <link rel="icon" href="/static/brand/favicon.svg" />

      href="/static/selfit-tryon/studio.css?v=20260911-body-no-label1"

  <body>
    <svg class="mirror-filter-definitions" width="0" height="0" aria-hidden="true"><defs><filter id="mirror-fine-accessory" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncA type="linear" slope="1.7"/></feComponentTransfer><feDropShadow dx="0" dy="0" stdDeviation="0.3" flood-color="#fffaf2" flood-opacity="0.65"/><feDropShadow dx="0" dy="0.25" stdDeviation="0.2" flood-color="#392519" flood-opacity="0.7"/></filter></defs></svg>
    <main id="studio" class="studio" aria-label="试穿与搭配">
      <div id="screen" class="screen"></div>
      <nav id="navigation" aria-label="主要导航"></nav>
      <button id="addGarmentFloating" class="add-garment" data-action="upload-garment" aria-label="上传单品" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="completionNotice" class="completion-notice" data-action="view-completed" aria-label="试穿成功，查看结果" hidden><svg class="completion-check" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.5 12 3 3 6-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>试穿成功</span><svg class="completion-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
      <div id="notice" role="status" aria-live="polite"></div>
      <dialog id="sheet" aria-labelledby="sheetTitle"></dialog>
      <input
        id="photoInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        hidden
      /><input
        id="garmentInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        hidden
      />
    </main>
    <script src="/static/selfit-tryon/outfit-layout.js?v=20260909-mirror-layout2"></script>

services:
  asis-demo:
    build: .
    ports:
      - "${APP_PORT:-8002}:8002"
    env_file:
      - .env.demo
    environment:
      ASIS_ENV: demo
      ASIS_PUBLIC_DEMO: "1"
      ASIS_AUTH_RETURN_DEV_CODE: "0"
      ASIS_AUTH_ALLOW_MOCK_CODES: "0"
      APP_HOST: 0.0.0.0
      APP_PORT: 8002
      REQUIRE_SIDECARS: "${REQUIRE_SIDECARS:-1}"
    volumes:
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./asis-agent-runtime/.openclaw:/app/asis-agent-runtime/.openclaw
      - ./asis-agent-runtime/.openclaw-home:/app/asis-agent-runtime/.openclaw-home
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s


<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>6 寸打印比例校验</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f1edeb;color:#302a29;font:16px system-ui}
  main{max-width:800px;margin:auto;padding:24px;background:#faf8f5;min-height:100vh}
  h1{font-size:24px}button{border:0;border-radius:999px;background:#174fe4;color:white;padding:14px 24px;font:inherit;font-weight:700;min-height:48px}
  .comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}.paper{background:white;aspect-ratio:2/3;box-shadow:0 2px 8px #0002}.paper img{display:block;width:100%;height:100%;object-fit:contain}
  h2{font-size:18px}p{line-height:1.6}#status{overflow-wrap:anywhere}@media(max-width:500px){.comparison{gap:12px}main{padding:20px}h2{font-size:16px}}
</style>
<main><h1>6 寸打印比例校验</h1><p>同一张测试邮票：只延展底色，完整保留原图。此页不会调用真实打印机。</p>
<button id="prepare">生成打印预览</button><p id="status" role="status">等待生成测试图</p>
<div class="comparison"><section><h2>之前：上下白边</h2><div class="paper"><img id="original" alt="旧版 6 寸打印预览"></div></section>
<section><h2>现在：底色铺满</h2><div class="paper"><img id="result" alt="新版 6 寸打印预览"></div></section></div></main>
<script src="/static/selfit/stamp/printing.js?v=20261028-1"></script>
<script>
  const $ = id => document.getElementById(id);
  let originalCanvas;
  // Intercept only the native print call in this isolated fixture. Production
  // StampPrinter still prepares and decodes its real six-inch PNG unchanged.
  const append = document.body.append.bind(document.body);
  document.body.append = function(frame) {
    if (frame.tagName === 'IFRAME') {
      const loaded = frame.onload;
      frame.onload = async () => {
        const target = frame.contentWindow;
        target.print = () => {
          target.dispatchEvent(new Event('beforeprint'));
          void (async () => {
            try {
              const blob = await (await fetch(frame.contentDocument.querySelector('img').src)).blob();
              $('result').src = URL.createObjectURL(blob); await $('result').decode();
              const canvas = document.createElement('canvas'); canvas.width = 900; canvas.height = 1350;
              const ctx = canvas.getContext('2d'); ctx.drawImage($('result'), 0, 0);
              const source = originalCanvas.getContext('2d').getImageData(0,0,900,1200).data;
              const center = ctx.getImageData(0,75,900,1200).data;
              const top = ctx.getImageData(0,0,900,75).data;
              const bottom = ctx.getImageData(0,1275,900,75).data;
              const same = source.every((value,index) => value === center[index]);
              const full = top.every((value,index) => value === source[index % 3600]) && bottom.every((value,index) => value === source[1199*3600 + index%3600]);
              const size = $('result').naturalWidth === 900 && $('result').naturalHeight === 1350;
              document.body.dataset.passed = String(same && full && size);
              $('status').textContent = same && full && size ? '通过：900×1350；原图逐像素一致，上下底色延展完整。' : '校验失败';
            } catch(e) { $('status').textContent = e.message; }
            finally { target.dispatchEvent(new Event('afterprint')); }
          })();
        };
        await loaded();
      };
    }
    append(frame);
  };
  $('prepare').onclick = async () => {
    $('prepare').disabled = true;
    try {
      originalCanvas = document.createElement('canvas'); originalCanvas.width = 900; originalCanvas.height = 1200;
      const ctx = originalCanvas.getContext('2d'); ctx.fillStyle = '#584f91'; ctx.fillRect(0,0,900,1200);
      ctx.fillStyle = '#cbd9e1'; ctx.fillRect(160,180,580,720);
      ctx.fillStyle = '#303b58'; ctx.font = '54px sans-serif'; ctx.fillText('WOKEN DAY',265,470); ctx.font = '36px sans-serif'; ctx.fillText('PRINT TEST',295,540);
      const template = new Image(); template.src = '/static/selfit/stamp/assets/stamps/stamp-01-2016-2017.png'; await template.decode(); ctx.drawImage(template,0,0,900,1200);
      const blob = await new Promise(resolve => originalCanvas.toBlob(resolve,'image/png'));
      $('original').src = URL.createObjectURL(blob); await $('original').decode();
      await new window.StampPrinter().print(blob);
    } catch(e) { $('status').textContent = e.message; }
    finally { $('prepare').disabled = false; }
  };
</script>
</html>
